services:
  db:
    image: postgres:16-alpine
    container_name: logforge-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-logforge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-logforge}
      POSTGRES_DB: ${POSTGRES_DB:-logforge}
    ports:
      - "${POSTGRES_HOST_PORT:-5434}:5432"
    volumes:
      - logforge_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-logforge} -d ${POSTGRES_DB:-logforge}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: logforge-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-logforge}:${POSTGRES_PASSWORD:-logforge}@db:5432/${POSTGRES_DB:-logforge}
      # Phase 7 evidence storage lives on a named volume, never in the bind-mounted source tree.
      RAW_VAULT_PATH: /var/lib/logforge/raw_vault
      EVIDENCE_ANCHOR_PATH: /var/lib/logforge/evidence_anchors
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - logforge_evidence:/var/lib/logforge
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  frontend:
    build:
      context: ./frontend
    container_name: logforge-frontend
    restart: unless-stopped
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000/api/v1}
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      backend:
        condition: service_healthy
    command: npm run dev -- --host 0.0.0.0 --port 5173

volumes:
  logforge_pgdata:
  logforge_evidence:

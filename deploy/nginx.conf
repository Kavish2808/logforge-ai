worker_processes auto;
pid logs/nginx.pid;
error_log logs/error.log warn;
worker_shutdown_timeout 50s;
events { worker_connections 1024; }
http {
    types {
        text/html html; text/css css; application/javascript js mjs;
        application/json json; image/svg+xml svg; image/png png;
        image/jpeg jpg jpeg; image/x-icon ico; font/woff2 woff2;
    }
    default_type application/octet-stream;
    server_tokens off;
    log_format upstream_json escape=json
      '{"time":"$time_iso8601","request_id":"$request_id",'
      '"method":"$request_method","path":"$uri","status":$status,'
      '"request_seconds":$request_time,"upstream":"$upstream_addr",'
      '"upstream_status":"$upstream_status","upstream_seconds":"$upstream_response_time",'
      '"request_bytes":$request_length,"response_bytes":$bytes_sent}';
    access_log logs/access.log upstream_json;
    client_body_temp_path client_body;
    proxy_temp_path proxy;
    fastcgi_temp_path fastcgi;
    uwsgi_temp_path uwsgi;
    scgi_temp_path scgi;
    client_max_body_size 64m;
    client_body_timeout 30s;
    send_timeout 60s;
    keepalive_timeout 15s;
    include upstreams.conf;
    server {
        listen 127.0.0.1:8080;
        root "__FRONTEND_DIST__";
        index index.html;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header X-Frame-Options DENY always;
        add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        location /api/ {
            proxy_pass http://logforge_backends;
            proxy_http_version 1.1;
            proxy_set_header Connection '';
            proxy_set_header Host $host;
            proxy_set_header X-Request-ID $request_id;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 2s;
            proxy_read_timeout 120s;
            proxy_send_timeout 120s;
            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_next_upstream_tries 2;
            proxy_intercept_errors on;
            error_page 502 504 = @unavailable;
        }
        location = /router/health { proxy_pass http://127.0.0.1:9080/health; }
        location = /router/metrics { proxy_pass http://127.0.0.1:9080/metrics; }
        location = /nginx_status { stub_status; allow 127.0.0.1; deny all; }
        location @unavailable {
            default_type application/json;
            add_header Retry-After 2 always;
            return 503 '{"detail":"No healthy backend is currently available; retry later (ingestion has no idempotency key; a retry after a lost response can duplicate an event)."}';
        }
        location / { try_files $uri $uri/ /index.html; }
    }
}

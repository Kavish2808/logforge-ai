# Step 10B benchmark load balancer: plain round-robin over every `api` replica.
worker_processes auto;
events { worker_connections 4096; }

http {
    # Docker's embedded DNS; `resolve` below re-reads the `api` A records every 2 s, so a replica that
    # is stopped and started again (possibly with a new IP) rejoins without restarting nginx.
    resolver 127.0.0.11 valid=2s ipv6=off;

    # One line per request: epoch ms, status, the upstream(s) tried, their statuses and timings.
    log_format bench '$msec $status "$upstream_addr" "$upstream_status" $request_time '
                     '"$upstream_response_time" $request_length $bytes_sent $request_method $uri';
    access_log /var/log/nginx-bench/access.log bench;
    error_log /var/log/nginx-bench/error.log warn;

    upstream api_pool {
        zone api_pool 256k;
        # passive health: after one failed attempt a replica is skipped for 5 s
        server api:8000 resolve max_fails=1 fail_timeout=5s;
        keepalive 64;
    }

    server {
        listen 8080;
        client_max_body_size 50m;

        location / {
            proxy_pass http://api_pool;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            # Retry on another replica only when the request could not be delivered (connect error /
            # connect timeout). nginx never re-sends a POST that already reached a replica unless
            # `non_idempotent` is set — it is NOT set, so an ingest is never silently replayed.
            proxy_next_upstream error timeout;
            proxy_connect_timeout 2s;
            proxy_read_timeout 120s;
            add_header X-Upstream $upstream_addr always;
        }

        location = /lb-health { access_log off; return 200 "ok\n"; }
    }
}

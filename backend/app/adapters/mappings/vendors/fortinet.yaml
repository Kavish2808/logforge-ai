# FortiGate syslog messages, where the message body is itself a
# key=value payload, e.g.:
#   <189>Jan 18 12:00:00 FGT100E FORTIGATE: date=2026-01-18 time=12:00:00
#   devname="FGT100E" devid="FG100E4Q17000000" type="traffic" subtype="forward"
#   level="notice" srcip=10.0.0.15 srcport=51422 dstip=8.8.8.8 dstport=53
#   proto=17 action="accept" ...
# The syslog parser auto-flattens key=value message bodies, so this
# mapping can reference those keys directly.
id: fortinet
vendor: Fortinet
product: FortiGate
format: syslog
version: "1"
description: "FortiGate syslog messages with key=value formatted payload."

match:
  format: syslog
  field: app_name
  equals: "FORTIGATE"

ocsf:
  class_uid: 4001
  class_name: "Network Activity"
  category_uid: 4
  category_name: "Network Activity"

event_type: "Firewall"
event_action_field: action

severity_field: level
severity_map:
  emergency: Emergency
  alert: Alert
  critical: Critical
  error: Error
  warning: Warning
  notice: Notice
  information: Informational
  debug: Debug

timestamp_field: timestamp

field_map:
  devname: { target: "device_hostname" }
  devid: { target: "device_id" }
  type: { target: "log_type" }
  subtype: { target: "log_subtype" }
  srcip: { target: "network.src_ip" }
  srcport: { target: "network.src_port", type: "int" }
  dstip: { target: "network.dst_ip" }
  dstport: { target: "network.dst_port", type: "int" }
  proto: { target: "network.protocol" }
  policyid: { target: "policy_id" }
  srcintf: { target: "src_interface" }
  dstintf: { target: "dst_interface" }
  sentbyte: { target: "bytes_sent", type: "int" }
  rcvdbyte: { target: "bytes_received", type: "int" }
  duration: { target: "duration_seconds", type: "int" }
  msg: { target: "event_message" }
  message: { target: "raw_message" }
